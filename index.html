<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 20% 10%, #0b1a2e, #03070f 90%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; padding: 14px; color: #e2f0ff;
  }
  .box {
    width: 100%; max-width: 420px;
    background: rgba(8, 20, 35, 0.8);
    border: 1px solid rgba(0, 200, 255, 0.35); border-radius: 40px;
    box-shadow: 0 0 30px rgba(0,180,255,0.3);
    padding: 20px; display: flex; flex-direction: column;
  }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 { font-size: 1.4rem; font-weight: 300; letter-spacing: 5px; color: #c0eaff; text-shadow: 0 0 12px #0af; }
  .status {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,150,255,0.15); padding: 6px 12px;
    border-radius: 40px; border: 1px solid #0af4;
    font-size: 0.7rem; font-weight: 600;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4aff9e; box-shadow: 0 0 10px #4aff9e; }
  .dot.on { background: #ff4a6e; box-shadow: 0 0 14px #ff4a6e; }
  .orb {
    width: 100px; height: 100px; border-radius: 50%; margin: 6px auto 10px;
    background: radial-gradient(circle at 30% 30%, #2e8bff, #0a4b7a 70%, #021b30);
    box-shadow: 0 0 30px #0af, inset 0 0 25px #00a6ff;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .orb.on { box-shadow: 0 0 50px #0af, 0 0 90px #0af, inset 0 0 40px #4af; }
  .orb svg { width: 55px; height: 55px; }
  .chat {
    height: 220px; overflow-y: auto; padding: 6px 4px;
    display: flex; flex-direction: column; gap: 8px;
    background: rgba(0,20,40,0.5); border-radius: 20px;
    border: 1px solid #0af4; margin-bottom: 10px;
  }
  .msg { padding: 9px 13px; border-radius: 16px; font-size: 0.9rem; line-height: 1.35; max-width: 88%; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #1e6eb0, #0a4b7a); border: 1px solid #4a9eff66; color: #fff; border-bottom-right-radius: 4px; }
  .msg.jarvis { align-self: flex-start; background: rgba(0,30,55,0.9); border: 1px solid #0af4; color: #d4f0ff; border-bottom-left-radius: 4px; }
  .row { display: flex; justify-content: center; gap: 16px; margin-top: 6px; }
  .mic {
    width: 70px; height: 70px; border-radius: 50%; border: 1px solid #6bd4ff66;
    background: radial-gradient(circle at 30% 20%, #1e6eb0, #083358);
    box-shadow: 0 0 20px #0af; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: white;
  }
  .mic:active { transform: scale(0.9); }
  .mic.on { background: radial-gradient(circle at 30% 20%, #b02e4a, #4a081a); box-shadow: 0 0 40px #ff3b5c; }
  .mic svg { width: 34px; height: 34px; fill: #d4f0ff; }
  .mic.on svg { fill: #ffe0e8; }
  .clear {
    width: 50px; height: 50px; border-radius: 50%; border: 1px solid #2e6a9e;
    background: rgba(20,50,80,0.8); color: #b0dcff; font-size: 1.5rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 0; }
  .chip { flex-shrink: 0; background: rgba(0,150,255,0.12); border: 1px solid #0af4; color: #a8d8ff; padding: 6px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <h1>JARVIS</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">READY</span>
    </div>
  </div>

  <div class="orb" id="orb">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="28" stroke="#8cd4ff" stroke-width="3" stroke-dasharray="8 8"/>
      <circle cx="50" cy="50" r="18" stroke="#c0eaff" stroke-width="2.5" stroke-dasharray="6 6"/>
      <circle cx="50" cy="50" r="8" fill="#8cd4ff"/>
    </svg>
  </div>

  <div class="chat" id="chat">
    <div class="msg jarvis">Good evening, sir. JARVIS at your service.</div>
  </div>

  <div class="chips">
    <div class="chip" data-cmd="what time is it">⏰ Time</div>
    <div class="chip" data-cmd="tell me a joke">😂 Joke</div>
    <div class="chip" data-cmd="flip a coin">🪙 Coin</div>
    <div class="chip" data-cmd="roll a dice">🎲 Dice</div>
    <div class="chip" data-cmd="tell me a fun fact">💡 Fact</div>
  </div>

  <div class="row">
    <button class="mic" id="micBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 15.5c-1.66 0-3-1.34-3-3v-6c0-1.66 1.34-3 3-3s3 1.34 3 3v6c0 1.66-1.34 3-3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V22h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <button class="clear" id="clearBtn">↺</button>
  </div>
</div>

<script>
var chat = document.getElementById('chat');
var micBtn = document.getElementById('micBtn');
var clearBtn = document.getElementById('clearBtn');
var dot = document.getElementById('dot');
var statusText = document.getElementById('statusText');
var orb = document.getElementById('orb');

var listening = false;
var recognition = null;
var synth = window.speechSynthesis;
var userName = null;

function speak(text) {
  if (!synth || !text) return;
  try { synth.cancel(); } catch(e) {}
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  u.pitch = 0.85;
  u.lang = 'en-GB';
  var voices = synth.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (/Google UK English Male/i.test(voices[i].name)) { u.voice = voices[i]; break; }
    if (/Daniel/i.test(voices[i].name)) { u.voice = voices[i]; break; }
  }
  synth.speak(u);
}

function addMsg(text, who) {
  var div = document.createElement('div');
  div.className = 'msg ' + (who || 'jarvis');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

var JOKES = [
  "Why did the developer go broke, sir? He used up all his cache.",
  "Why do programmers prefer dark mode, sir? Because light attracts bugs.",
  "What is a computer's favourite snack, sir? Microchips.",
  "Why did the smartphone need glasses, sir? It lost all its contacts."
];
var FACTS = [
  "Honey never spoils, sir. Three thousand year old honey was found in Egyptian tombs.",
  "Octopuses have three hearts and blue blood, sir.",
  "A day on Venus is longer than its year, sir.",
  "Bananas are berries, sir, but strawberries are not."
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function reply(input) {
  var t = input.toLowerCase().trim();

  if (/\b(hello|hi|hey)\b/.test(t)) {
    var h = new Date().getHours();
    var g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    return g + ", sir." + (userName ? " Always a pleasure, " + userName + "." : " How may I help?");
  }

  if (/\b(what'?s your name|who are you)\b/.test(t))
    return "I am JARVIS, sir. Just A Rather Very Intelligent System.";
  if (/\b(my name is|call me) (\w+)/.test(t)) {
    var m = t.match(/\b(?:my name is|call me) (\w+)/);
    userName = m[1].charAt(0).toUpperCase() + m[1].slice(1);
    return "A pleasure to meet you, " + userName + ". I shall remember that.";
  }
  if (/\b(what'?s my name|who am i)\b/.test(t))
    return userName ? "You are " + userName + ", sir." : "You have not told me your name yet, sir.";

  if (/\b(thank|thanks|cheers)\b/.test(t)) return "You are most welcome, sir.";
  if (/\b(bye|goodbye|see you)\b/.test(t)) return "Goodbye, sir. I shall be here when you need me.";

  if (/\btime\b/.test(t) && !/\btimes\b/.test(t)) {
    var now = new Date();
    return "The time is " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ", sir.";
  }
  if (/\b(date|day)\b/.test(t) && /\b(what|today|which)\b/.test(t)) {
    var d = new Date();
    return "Today is " + d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}) + ", sir.";
  }

  var mathExpr = t
    .replace(/what(?:'s| is)?/g, '')
    .replace(/plus/g, '+').replace(/minus/g, '-')
    .replace(/times|multiplied by/g, '*')
    .replace(/divided by/g, '/')
    .replace(/[^0-9+\-*/().\s]/g, '')
    .trim();
  if (/[+\-*/]/.test(mathExpr) && /\d/.test(mathExpr)) {
    try {
      var result = Function('"use strict"; return (' + mathExpr + ')')();
      if (typeof result === 'number' && isFinite(result)) {
        return "That would be " + result + ", sir.";
      }
    } catch(e) {}
  }

  if (/\b(flip a coin|toss a coin)\b/.test(t))
    return "It is " + (Math.random() < 0.5 ? 'heads' : 'tails') + ", sir.";
  if (/\b(roll a (dice|die))\b/.test(t))
    return "You have rolled a " + (Math.floor(Math.random()*6)+1) + ", sir.";
  if (/\b(random number|pick a number)\b/.test(t))
    return "I have chosen " + (Math.floor(Math.random()*100)+1) + ", sir.";

  if (/\b(joke|funny|laugh)\b/.test(t)) return pick(JOKES);
  if (/\b(fun fact|tell me a fact|did you know)\b/.test(t)) return pick(FACTS);

  if (/\b(help|what can you do)\b/.test(t))
    return "I can tell the time, the date, do math, tell jokes and facts, flip coins, roll dice, and remember your name, sir.";

  return pick([
    "I am not certain I understood, sir. Perhaps rephrase?",
    "I am afraid that one eludes me, sir.",
    "Curious, sir. I am still learning that.",
    "Could you say that another way, sir?"
  ]);
}

function handle(text) {
  addMsg(text, 'user');
  var r = reply(text);
  addMsg(r, 'jarvis');
  setTimeout(function() { speak(r); }, 200);
}

function setState(on) {
  listening = on;
  if (on) {
    micBtn.classList.add('on');
    dot.classList.add('on');
    orb.classList.add('on');
    statusText.textContent = 'LISTENING';
  } else {
    micBtn.classList.remove('on');
    dot.classList.remove('on');
    orb.classList.remove('on');
    statusText.textContent = 'READY';
  }
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SR) {
  addMsg('Sorry sir, this browser does not support voice. Try Chrome.', 'jarvis');
  micBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.lang = 'en-GB';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() { setState(true); };

  recognition.onresult = function(e) {
    var text = e.results[0][0].transcript;
    setState(false);
    handle(text);
  };

  recognition.onerror = function(e) {
    setState(false);
    if (e.error === 'no-speech') addMsg('I did not hear you, sir.', 'jarvis');
    else if (e.error === 'not-allowed') addMsg('Microphone is blocked, sir.', 'jarvis');
    else if (e.error !== 'aborted') addMsg('Error, sir: ' + e.error, 'jarvis');
  };

  recognition.onend = function() { setState(false); };
}

micBtn.onclick = function() {
  if (!recognition) return;
  if (listening) { try { recognition.stop(); } catch(e){} return; }
  if (synth) { try { synth.cancel(); } catch(e){} }
  try { recognition.start(); } catch(e) { setState(false); }
};

clearBtn.onclick = function() {
  if (synth) { try { synth.cancel(); } catch(e){} }
  if (listening && recognition) { try { recognition.stop(); } catch(e){} }
  chat.innerHTML = '';
  userName = null;
  addMsg('Systems reset, sir. How may I assist?', 'jarvis');
};

var chips = document.querySelectorAll('.chip');
for (var i = 0; i < chips.length; i++) {
  chips[i].onclick = function() {
    handle(this.getAttribute('data-cmd'));
  };
}

if (synth) {
  synth.getVoices();
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function() { synth.getVoices(); };
}
</script>
</body>
</html>
