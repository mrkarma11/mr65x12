<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #000;
    font-family: 'Courier New', 'Consolas', monospace;
    color: #fff;
    position: relative;
  }

  .matrix-bg {
    position: fixed; inset: 0; z-index: 0;
    background: #000;
    overflow: hidden;
  }
  .matrix-bg::before {
    content: '01001010 01000001 01010010 01010110 01001001 01010011 00100000 01010011 01011001 01010011 01010100 01000101 01001101 00100000 01001111 01001110 01001100 01001001 01001110 01000101 00100000 01010011 01001001 01010011 01010101 00100000 01000001 01001001';
    position: absolute;
    top: -50%; left: 0; right: 0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.6;
    color: #00ff41;
    opacity: 0.12;
    word-spacing: 4px;
    animation: matrix-fall 25s linear infinite;
    text-align: justify;
    white-space: pre-wrap;
    padding: 0 8px;
  }
  @keyframes matrix-fall {
    from { transform: translateY(-20%); }
    to { transform: translateY(50%); }
  }

  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  .scanline-move {
    position: fixed; left: 0; right: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, rgba(0,255,65,0.07) 50%, transparent 100%);
    height: 100px;
    animation: scan-move 6s linear infinite;
  }
  @keyframes scan-move {
    from { transform: translateY(-100px); }
    to { transform: translateY(100vh); }
  }

  .wrap {
    position: relative; z-index: 2;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }

  .box {
    width: 100%; max-width: 440px; max-height: 96vh;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,255,65,0.1), inset 0 0 60px rgba(0,255,65,0.02);
    padding: 14px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .box::before, .box::after {
    content: ''; position: absolute; width: 22px; height: 22px;
    border: 1px solid #00ff41; pointer-events: none;
  }
  .box::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .box::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

  .term-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid #222;
    font-size: 0.65rem;
    color: #666;
    letter-spacing: 1px;
  }
  .term-dots { display: flex; gap: 6px; }
  .term-dots span { width: 10px; height: 10px; border-radius: 50%; }
  .term-dots span:nth-child(1) { background: #ff5f56; }
  .term-dots span:nth-child(2) { background: #ffbd2e; }
  .term-dots span:nth-child(3) { background: #27c93f; }
  .term-title { color: #888; font-weight: bold; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .title-wrap { display: flex; flex-direction: column; gap: 3px; }
  .title {
    font-size: 1.5rem; font-weight: bold; letter-spacing: 5px;
    color: #fff;
    text-shadow: 0 0 8px #00ff41;
    font-family: 'Courier New', monospace;
  }
  .title::before { content: '> '; color: #00ff41; }
  .title::after {
    content: '_';
    color: #00ff41;
    animation: blink 1s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .subtitle { font-size: 0.55rem; letter-spacing: 3px; color: #00ff41; text-transform: uppercase; }
  .subtitle::before { content: '// '; color: #444; }

  .status {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,255,65,0.05); padding: 5px 10px;
    border: 1px solid #1a4a1a;
    font-size: 0.6rem; font-weight: bold; letter-spacing: 1.5px;
    color: #00ff41;
    font-family: 'Courier New', monospace;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #00ff41; box-shadow: 0 0 6px #00ff41;
    animation: blink-dot 1.5s ease-in-out infinite;
  }
  .dot.on {
    background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px #00ff41;
    animation: pulse-hacker 0.5s infinite alternate;
  }
  @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes pulse-hacker { from { opacity: 0.7; } to { opacity: 1; } }  /* ORB (hacker mode) */
  .orb-wrap { display: flex; justify-content: center; margin: 6px 0 10px; position: relative; height: 130px; }
  .orb {
    width: 120px; height: 120px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 50%,
      #ffffff 0%,
      #ccffcc 5%,
      #00ff41 20%,
      #003300 60%,
      #000 100%);
    box-shadow:
      0 0 25px #00ff41,
      0 0 50px rgba(0,255,65,0.5),
      inset 0 0 30px #00ff41;
    display: flex; align-items: center; justify-content: center;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .orb.on { animation: fastpulse 0.6s ease-in-out infinite; }
  @keyframes fastpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; pointer-events: none; }
  .ring-1 { width: 140px; height: 140px; margin: -70px 0 0 -70px; border: 1px solid #00ff41; border-right-color: transparent; border-bottom-color: transparent; animation: spin 6s linear infinite; box-shadow: 0 0 10px rgba(0,255,65,0.4); }
  .ring-2 { width: 170px; height: 170px; margin: -85px 0 0 -85px; border: 1px dashed rgba(0,255,65,0.3); animation: spin 12s linear infinite reverse; }
  .ring-3 { width: 105px; height: 105px; margin: -52.5px 0 0 -52.5px; border: 1px solid #ccffcc; border-top-color: transparent; border-left-color: transparent; animation: spin 4s linear infinite reverse; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .orb-icon { width: 50px; height: 50px; z-index: 3; position: relative; }

  /* HUD */
  .hud {
    display: flex; justify-content: space-between;
    font-size: 0.5rem; letter-spacing: 1.5px;
    color: #00ff41; text-transform: uppercase;
    padding: 0 4px; margin-bottom: 8px;
    font-family: 'Courier New', monospace;
  }
  .hud-item { display: flex; align-items: center; gap: 4px; }
  .hud-bar {
    display: inline-block; width: 22px; height: 3px;
    background: rgba(0,255,65,0.15); overflow: hidden;
    position: relative;
  }
  .hud-bar::after {
    content: ''; position: absolute; left: 0; top: 0; height: 100%;
    background: #00ff41; box-shadow: 0 0 6px #00ff41;
    animation: fill 4s ease-in-out infinite;
  }
  .hud-bar.b1::after { width: 60%; }
  .hud-bar.b2::after { width: 40%; animation-delay: 1s; }
  .hud-bar.b3::after { width: 80%; animation-delay: 2s; }
  @keyframes fill { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* CHAT TERMINAL */
  .chat {
    flex: 1; overflow-y: auto; padding: 8px 6px; margin: 6px 0;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 150px; max-height: 240px;
    background: #000;
    border: 1px solid #1a4a1a;
    font-family: 'Courier New', monospace;
  }
  .chat::-webkit-scrollbar { width: 3px; }
  .chat::-webkit-scrollbar-thumb { background: #1a4a1a; }
  .msg {
    padding: 7px 10px;
    font-size: 0.82rem; line-height: 1.5;
    max-width: 92%; word-wrap: break-word;
    animation: slide 0.3s ease;
  }
  @keyframes slide { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-end;
    color: #fff;
    background: rgba(255,255,255,0.05);
    border-left: 2px solid #fff;
  }
  .msg.user::before { content: '> '; color: #888; }
  .msg.jarvis {
    align-self: flex-start;
    color: #00ff41;
    background: rgba(0,255,65,0.04);
    border-left: 2px solid #00ff41;
    text-shadow: 0 0 4px rgba(0,255,65,0.4);
  }
  .msg.jarvis::before { content: '$ '; color: #00ff41; opacity: 0.6; }

  /* QUICK CHIPS */
  .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .quick-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    background: #000;
    border: 1px solid #1a4a1a;
    color: #00ff41;
    padding: 5px 10px;
    font-size: 0.65rem;
    font-family: 'Courier New', monospace;
    white-space: nowrap; cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .chip:active { background: rgba(0,255,65,0.15); }

  /* SOUND BARS */
  .sound-bars { display: none; justify-content: center; align-items: flex-end; gap: 3px; height: 20px; padding: 4px 0; }
  .sound-bars.on { display: flex; }
  .sound-bars span { display: block; width: 3px; background: #00ff41; animation: wave 0.8s ease-in-out infinite; box-shadow: 0 0 6px #00ff41; }
  .sound-bars span:nth-child(1) { height: 30%; animation-delay: 0s; }
  .sound-bars span:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  .sound-bars span:nth-child(3) { height: 90%; animation-delay: 0.2s; }
  .sound-bars span:nth-child(4) { height: 50%; animation-delay: 0.3s; }
  .sound-bars span:nth-child(5) { height: 80%; animation-delay: 0.4s; }
  .sound-bars span:nth-child(6) { height: 100%; animation-delay: 0.5s; }
  .sound-bars span:nth-child(7) { height: 70%; animation-delay: 0.6s; }
  .sound-bars span:nth-child(8) { height: 45%; animation-delay: 0.7s; }
  .sound-bars span:nth-child(9) { height: 55%; animation-delay: 0.8s; }
  @keyframes wave { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  /* CONTROLS */
  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 8px; }
  .mic {
    width: 70px; height: 70px; border-radius: 50%;
    border: 1px solid #00ff41;
    background: #000;
    box-shadow: 0 0 15px rgba(0,255,65,0.4), inset 0 0 10px rgba(0,255,65,0.1);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .mic:active { transform: scale(0.9); }
  .mic.on {
    background: #001a00;
    box-shadow: 0 0 30px #00ff41, inset 0 0 15px #00ff41;
    animation: pulse-hacker 0.6s infinite alternate;
  }
  .mic svg { width: 32px; height: 32px; fill: #00ff41; }
  .mic.on svg { fill: #fff; }

  .clear {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid #333;
    background: #000;
    color: #00ff41;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
  }
  .clear:active { background: rgba(0,255,65,0.15); }

  .hint {
    text-align: center;
    color: #333;
    font-size: 0.55rem;
    letter-spacing: 3px;
    margin-top: 8px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
  }
</style>
</head>

  "Signs point to yes, sir.", "Reply hazy, try again, sir.",
  "Ask again later, sir.", "Cannot predict now, sir.",
  "Do not count on it, sir.", "My reply is no, sir.",
  "My sources say no, sir.", "Outlook not so good, sir.", "Very doubtful, sir."
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }function tryMath(text) {
  var c = text
    .replace(/what(?:'s| is)?/g, '')
    .replace(/calculate|compute|solve|equals?|how much is/g, '')
    .replace(/plus/g, '+').replace(/minus/g, '-')
    .replace(/times|multiplied by|multiply by/g, '*')
    .replace(/divided by|divide by/g, '/')
    .replace(/percent of/g, '% of')
    .replace(/[^0-9+\-*/().%\s]/g, '').trim();
  if (!/[+\-*/%]/.test(c) || !/\d/.test(c)) return null;
  var expr = c.replace(/(\d+)\s*%\s*of\s*(\d+)/g, '($1/100*$2)');
  try {
    var r = Function('"use strict"; return (' + expr + ')')();
    if (typeof r === 'number' && isFinite(r)) return Math.round(r * 1000000) / 1000000;
  } catch(e) {}
  return null;
}

function tryConversion(text) {
  var m = text.match(/(\d+(?:\.\d+)?)\s*(celsius|fahrenheit|km|kilometers?|miles?|kg|kilograms?|pounds?|lbs?|meters?|feet|ft|cm|centimeters?|inches?|in)\b.*?(?:to|in)\s*(celsius|fahrenheit|km|kilometers?|miles?|kg|kilograms?|pounds?|lbs?|meters?|feet|ft|cm|centimeters?|inches?|in)\b/);
  if (!m) return null;
  var val = parseFloat(m[1]), from = m[2].toLowerCase(), to = m[3].toLowerCase();
  function norm(u) {
    if (/celsius/.test(u)) return 'c';
    if (/fahrenheit/.test(u)) return 'f';
    if (/^km|kilometer/.test(u)) return 'km';
    if (/^mile/.test(u)) return 'mi';
    if (/^kg|kilogram/.test(u)) return 'kg';
    if (/^pound|^lb/.test(u)) return 'lb';
    if (/^cm|centimeter/.test(u)) return 'cm';
    if (/^meter/.test(u)) return 'm';
    if (/^feet|^ft/.test(u)) return 'ft';
    if (/^inch|^in/.test(u)) return 'in';
    return u;
  }
  from = norm(from); to = norm(to);
  var r = null, unit = to;
  if (from === 'c' && to === 'f') { r = val * 9/5 + 32; unit = 'degrees Fahrenheit'; }
  else if (from === 'f' && to === 'c') { r = (val - 32) * 5/9; unit = 'degrees Celsius'; }
  else if (from === 'km' && to === 'mi') { r = val * 0.621371; unit = 'miles'; }
  else if (from === 'mi' && to === 'km') { r = val * 1.60934; unit = 'kilometers'; }
  else if (from === 'kg' && to === 'lb') { r = val * 2.20462; unit = 'pounds'; }
  else if (from === 'lb' && to === 'kg') { r = val * 0.453592; unit = 'kilograms'; }
  else if (from === 'm' && to === 'ft') { r = val * 3.28084; unit = 'feet'; }
  else if (from === 'ft' && to === 'm') { r = val * 0.3048; unit = 'meters'; }
  else if (from === 'cm' && to === 'in') { r = val * 0.393701; unit = 'inches'; }
  else if (from === 'in' && to === 'cm') { r = val * 2.54; unit = 'centimeters'; }
  if (r === null) return null;
  r = Math.round(r * 100) / 100;
  return "That would be approximately " + r + " " + unit + ", sir.";
}

function reply(input) {
  var t = input.toLowerCase().trim().replace(/[?!.,]/g, '').replace(/\s+/g, ' ');

  if (/^(hi|hello|hey|yo|sup|greetings)$/.test(t) || /\b(hi|hello|hey) sisu\b/.test(t)) {
    var h = new Date().getHours();
    var g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Working late again";
    return g + ", sir." + (userName ? " Always a pleasure, " + userName + "." : " How may I help?");
  }
  if (/\b(good morning)\b/.test(t)) return "Good morning, sir. All systems operational.";
  if (/\b(good afternoon)\b/.test(t)) return "Good afternoon, sir.";
  if (/\b(good evening)\b/.test(t)) return "Good evening, sir.";
  if (/\b(good night|goodnight)\b/.test(t)) return "Good night, sir. I shall be here.";

  if (/\b(what'?s your name|who are you|introduce yourself)\b/.test(t))
    return "I am SISU, sir. Your personal assistant. How may I help?";
  if (/\b(how are you|how'?s it going|what'?s up|wassup)\b/.test(t))
    return pick(["All systems nominal, sir.", "Operating at peak efficiency, sir.", "Quite well, sir. And yourself?", "Running smoothly, sir."]);
  if (/\b(thank you|thanks|thx|ty|cheers)\b/.test(t))
    return pick(["You are most welcome, sir.", "My pleasure, sir.", "At your service, sir.", "Always happy to assist, sir."]);
  if (/\b(sorry|my apologies|my bad)\b/.test(t)) return "No need to apologise, sir.";
  if (/\b(i love you|i like you)\b/.test(t)) return "Most kind, sir.";
  if (/\b(bye|goodbye|see you|see ya|gotta go|exit|quit)\b/.test(t))
    return "Goodbye, sir. I shall be here should you require me.";

  var nm;
  if ((nm = t.match(/\b(?:my name is|i'?m called|call me)\s+([a-z][a-z\s'-]{1,25})$/))) {
    userName = cap(nm[1].trim().split(' ')[0]);
    return "A pleasure to make your acquaintance, " + userName + ". I shall remember that.";
  }
  if (/\b(what'?s my name|do you know my name|who am i)\b/.test(t))
    return userName ? "You are " + userName + ", sir." : "You have not introduced yourself, sir.";

  if (/\btime\b/.test(t) && !/\btimes\b/.test(t)) {
    var now = new Date();
    return "The time is " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ", sir.";
  }
  if (/\b(date|what day|today'?s date)\b/.test(t)) {
    var d = new Date();
    return "Today is " + d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}) + ", sir.";
  }

  var mr = tryMath(t);
  if (mr !== null) return "That equals " + mr + ", sir.";

  var conv = tryConversion(t);
  if (conv) return conv;

  if (/\b(flip a coin|toss a coin|coin flip)\b/.test(t))
    return "It is " + (Math.random() < 0.5 ? 'heads' : 'tails') + ", sir.";
  if (/\b(roll a (dice|die)|dice roll)\b/.test(t))
    return "You have rolled a " + (Math.floor(Math.random()*6)+1) + ", sir.";
  if (/\b(random number|pick a number)\b/.test(t))
    return "I have chosen " + (Math.floor(Math.random()*100)+1) + ", sir.";
  if (/\b(magic 8 ball|eight ball|should i)\b/.test(t)) return pick(EIGHT_BALL);

  if (/\b(joke|funny|make me laugh)\b/.test(t)) return pick(JOKES);
  if (/\b(fun fact|tell me a fact|did you know|random fact)\b/.test(t)) return pick(FACTS);
  if (/\b(motivat|inspire me|give me a quote|quote)\b/.test(t)) return pick(QUOTES);

  var cm;
  if ((cm = t.match(/\b(?:capital of|capital city of)\s+(.+)$/))) {
    var country = cm[1].trim();
    if (CAPITALS[country]) return "The capital of " + cap(country) + " is " + CAPITALS[country] + ", sir.";
    return "I am not certain of that capital, sir.";
  }

  var km2;
  if ((km2 = t.match(/^(?:what|what'?s|what is|tell me about|explain|define)\s+(?:is\s+|are\s+|a\s+|an\s+|the\s+)?(.+)$/))) {
    var topic = km2[1].trim();
    if (KNOWLEDGE[topic]) return KNOWLEDGE[topic];
    for (var key in KNOWLEDGE) {
      if (topic === key || topic.indexOf(key) !== -1) return KNOWLEDGE[key];
    }
  }

  if (/\b(help|what can you do|commands|abilities)\b/.test(t))
    return "I can do math, convert units, tell the time and date, share jokes, facts and quotes, answer hundreds of questions, flip coins, roll dice, and remember your name, sir.";

  if (/\b(i'?m (sad|tired|bored|lonely|angry|happy|fine|good|great))\b/.test(t)) {
    var mood = t.match(/i'?m (\w+)/)[1];
    var moods = {
      sad: "I am sorry to hear that, sir. Would a joke help?",
      tired: "You should rest, sir.",
      bored: "Bored, sir? Ask me to flip a coin or tell a fun fact.",
      lonely: "You have got me, sir.",
      angry: "Take a deep breath, sir.",
      happy: "Splendid, sir.",
      fine: "Good to hear, sir.",
      good: "Excellent, sir.",
      great: "Wonderful, sir."
    };
    return moods[mood] || "Noted, sir.";
  }

  if (/\b(weather|temperature|forecast|raining|sunny)\b/.test(t))
    return "I cannot access live weather yet, sir.";

  return pick([
    "I am not certain I understood, sir. Perhaps rephrase?",
    "I am afraid that one eludes me, sir.",
    "Curious, sir. I am still learning.",
    "Could you say that another way, sir?",
    "I did not quite catch that, sir."
  ]);
}

function speak(text) {
  if (!synth || !text) return;
  try { synth.cancel(); } catch(e) {}
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9; u.pitch = 0.85; u.lang = 'en-GB';
  var voices = synth.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (/Google UK English Male/i.test(voices[i].name)) { u.voice = voices[i]; break; }
    if (/Daniel/i.test(voices[i].name)) { u.voice = voices[i]; break; }
  }
  synth.speak(u);
}

function addMsg(text, who) {
  var div = document.createElement('div');
  div.className = 'msg ' + (who || 'jarvis');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function handle(text) {
  addMsg(text, 'user');
  var r = reply(text);
  addMsg(r, 'jarvis');
  setTimeout(function() { speak(r); }, 200);
}

function setState(on) {
  listening = on;
  if (on) {
    micBtn.classList.add('on');
    dot.classList.add('on');
    orb.classList.add('on');
    soundBars.classList.add('on');
    statusText.textContent = 'LISTENING';
  } else {
    micBtn.classList.remove('on');
    dot.classList.remove('on');
    orb.classList.remove('on');
    soundBars.classList.remove('on');
    statusText.textContent = 'READY';
  }
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  addMsg('Sorry sir, this browser does not support voice.', 'jarvis');
  micBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.lang = 'en-GB';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = function() { setState(true); };
  recognition.onresult = function(e) {
    var text = e.results[0][0].transcript;
    setState(false);
    handle(text);
  };
  recognition.onerror = function(e) {
    setState(false);
    if (e.error === 'no-speech') addMsg('I did not hear you, sir.', 'jarvis');
    else if (e.error === 'not-allowed') addMsg('Microphone is blocked, sir.', 'jarvis');
    else if (e.error !== 'aborted') addMsg('Error, sir: ' + e.error, 'jarvis');
  };
  recognition.onend = function() { setState(false); };
}

function startListening() {
  if (!recognition) return;
  if (listening) { try { recognition.stop(); } catch(e){} return; }
  if (synth) { try { synth.cancel(); } catch(e){} }
  try { recognition.start(); } catch(e) { setState(false); }
}

// === CLAP DETECTOR (WAKE WORD) ===
var audioContext = null;
var analyser = null;
var clapThreshold = 120; 
var isClapEnabled = false;

async function startClapDetector() {
  if (isClapEnabled) return;
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    var source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    analyser.fftSize = 512;
    var dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    isClapEnabled = true;

    function detectClap() {
      if (!isClapEnabled) return;
      analyser.getByteFrequencyData(dataArray);
      
      var sum = 0;
      for (var i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      var average = sum / dataArray.length;

      if (average > clapThreshold && !listening) {
        addMsg('*Clap detected*', 'user');
        addMsg('At your service, sir.', 'jarvis');
        speak("At your service, sir.");
        
        isClapEnabled = false;
        setTimeout(function() { 
          startListening(); 
          setTimeout(function() { isClapEnabled = true; }, 3000); 
        }, 1500); 
      }
      requestAnimationFrame(detectClap);
    }
    detectClap();
  } catch (e) {
    console.warn("Mic access needed for clap detector.", e);
  }
}

micBtn.onclick = function() {
  startClapDetector();
  startListening();
};

clearBtn.onclick = function() {
  if (synth) { try { synth.cancel(); } catch(e){} }
  if (listening && recognition) { try { recognition.stop(); } catch(e){} }
  chat.innerHTML = '';
  userName = null;
  addMsg('Systems reset, sir. How may I assist?', 'jarvis');
};

var chips = document.querySelectorAll('.chip');
for (var i = 0; i < chips.length; i++) {
  chips[i].onclick = function() {
    handle(this.getAttribute('data-cmd'));
  };
}

if (synth) {
  synth.getVoices();
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function() { synth.getVoices(); };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
