    animation: drift 30s linear infinite;
    opacity: 0.5;
  }
  @keyframes drift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }

  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg,

      transparent 1px, transparent 4px);
  }

  .wrap {
    position: relative; z-index: 2;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 14px;
  }
  .box {
    width: 100%; max-width: 440px; max-height: 96vh;
    background: linear-gradient(180deg, rgba(8,20,35,0.9), rgba(3,10,20,0.95));
    border: 1px solid rgba(0,200,255,0.4);
    border-radius: 40px;
    box-shadow: 0 0 40px rgba(0,170,255,0.25), inset 0 0 60px rgba(0,150,255,0.08);
    padding: 18px; display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .box::before, .box::after {
    content: ''; position: absolute; width: 28px; height: 28px;
    border: 2px solid #0af; pointer-events: none;
    filter: drop-shadow(0 0 6px #0af);
  }
  .box::before { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .box::after { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; }
  .title {
    font-size: 1.5rem; font-weight: 200; letter-spacing: 8px;
    background: linear-gradient(90deg, #4af, #c0eaff, #4af);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px #0af);
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .subtitle { font-size: 0.55rem; letter-spacing: 3px; color: #4a8fbf; text-transform: uppercase; }

  .status {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,150,255,0.12); padding: 6px 12px;
    border-radius: 40px; border: 1px solid #0af5;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px;
    color: #a8d8ff;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4aff9e; box-shadow: 0 0 10px #4aff9e; }
  .dot.on { background: #ff4a6e; box-shadow: 0 0 14px #ff4a6e, 0 0 24px #ff4a6e; animation: pulse 0.9s infinite alternate; }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

  .orb-wrap { display: flex; justify-content: center; margin: 6px 0 10px; position: relative; height: 140px; }
  .orb {
    width: 130px; height: 130px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 50% 50%, #fff 0%, #8cd4ff 8%, #2e8bff 20%, #0a4b7a 50%, #021b30 75%, #000 100%);
    box-shadow: 0 0 30px #0af, 0 0 60px #0af8, 0 0 100px #0af5, inset 0 0 40px #4af;
    display: flex; align-items: center; justify-content: center;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .orb.on { animation: fastpulse 0.6s ease-in-out infinite; }
  @keyframes fastpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; pointer-events: none; }
  .ring-1 { width: 150px; height: 150px; margin: -75px 0 0 -75px; border: 1px solid #4af; border-right-color: transparent; border-bottom-color: transparent; animation: spin 6s linear infinite; box-shadow: 0 0 12px #0af5; }
  .ring-2 { width: 180px; height: 180px; margin: -90px 0 0 -90px; border: 1px dashed rgba(0,170,255,0.3); animation: spin 12s linear infinite reverse; }
  .ring-3 { width: 115px; height: 115px; margin: -57.5px 0 0 -57.5px; border: 1px solid #8cd4ff; border-top-color: transparent; border-left-color: transparent; animation: spin 4s linear infinite reverse; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .orb-icon { width: 55px; height: 55px; z-index: 3; position: relative; }  .hud { display: flex; justify-content: space-between; font-size: 0.5rem; letter-spacing: 1.5px; color: #4a8fbf; text-transform: uppercase; padding: 0 6px; margin-bottom: 8px; font-family: 'Courier New', monospace; }
  .hud-item { display: flex; align-items: center; gap: 4px; }
  .hud-bar { display: inline-block; width: 24px; height: 3px; background: rgba(0,170,255,0.15); border-radius: 2px; overflow: hidden; position: relative; }
  .hud-bar::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; background: #0af; box-shadow: 0 0 6px #0af; animation: fill 4s ease-in-out infinite; }
  .hud-bar.b1::after { width: 60%; }
  .hud-bar.b2::after { width: 40%; animation-delay: 1s; }
  .hud-bar.b3::after { width: 80%; animation-delay: 2s; }
  @keyframes fill { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .chat {
    flex: 1; overflow-y: auto; padding: 8px 6px; margin: 6px 0;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 150px; max-height: 240px;
    background: rgba(0,20,40,0.5); border-radius: 18px;
    border: 1px solid rgba(0,170,255,0.25);
    box-shadow: inset 0 0 25px rgba(0,150,255,0.06);
  }
  .chat::-webkit-scrollbar { width: 3px; }
  .chat::-webkit-scrollbar-thumb { background: #1e4460; border-radius: 3px; }
  .msg { padding: 9px 13px; border-radius: 16px; font-size: 0.88rem; line-height: 1.4; max-width: 88%; word-wrap: break-word; animation: slide 0.3s ease; }
  @keyframes slide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #1e6eb0, #0a4b7a); border: 1px solid rgba(74,158,255,0.4); color: #fff; border-bottom-right-radius: 4px; }
  .msg.jarvis { align-self: flex-start; background: rgba(0,30,55,0.85); border: 1px solid rgba(0,170,255,0.35); color: #d4f0ff; border-bottom-left-radius: 4px; }

  .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .quick-chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; background: rgba(0,150,255,0.12); border: 1px solid #0af5; color: #a8d8ff; padding: 6px 12px; border-radius: 20px; font-size: 0.7rem; white-space: nowrap; cursor: pointer; }
  .chip:active { background: rgba(0,150,255,0.35); transform: scale(0.95); }

  .sound-bars { display: none; justify-content: center; align-items: flex-end; gap: 3px; height: 20px; padding: 4px 0; }
  .sound-bars.on { display: flex; }
  .sound-bars span { display: block; width: 3px; background: linear-gradient(180deg, #4af, #0af); border-radius: 2px; animation: wave 0.8s ease-in-out infinite; box-shadow: 0 0 6px #0af; }
  .sound-bars span:nth-child(1) { height: 30%; animation-delay: 0s; }
  .sound-bars span:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  .sound-bars span:nth-child(3) { height: 90%; animation-delay: 0.2s; }
  .sound-bars span:nth-child(4) { height: 50%; animation-delay: 0.3s; }
  .sound-bars span:nth-child(5) { height: 80%; animation-delay: 0.4s; }
  .sound-bars span:nth-child(6) { height: 100%; animation-delay: 0.5s; }
  .sound-bars span:nth-child(7) { height: 70%; animation-delay: 0.6s; }
  .sound-bars span:nth-child(8) { height: 45%; animation-delay: 0.7s; }
  .sound-bars span:nth-child(9) { height: 55%; animation-delay: 0.8s; }
  @keyframes wave { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 8px; }
  .mic {
    width: 74px; height: 74px; border-radius: 50%; border: 1px solid #6bd4ff66;
    background: radial-gradient(circle at 30% 20%, #1e6eb0, #083358);
    box-shadow: 0 0 20px #0af; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: white;
  }
  .mic:active { transform: scale(0.9); }
  .mic.on { background: radial-gradient(circle at 30% 20%, #b02e4a, #4a081a); box-shadow: 0 0 40px #ff3b5c; }
  .mic svg { width: 36px; height: 36px; fill: #d4f0ff; }
  .mic.on svg { fill: #ffe0e8; }
  .clear { width: 50px; height: 50px; border-radius: 50%; border: 1px solid #2e6a9e; background: rgba(20,50,80,0.8); color: #b0dcff; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .clear:active { background: rgba(30,80,130,0.9); transform: scale(0.9); }

  .hint { text-align: center; color: #4a8fbf; font-size: 0.62rem; letter-spacing: 2px; margin-top: 8px; text-transform: uppercase; }
</style>
</head>

    .replace(/calculate|compute|solve|equals?|how much is/g, '')
    .replace(/plus/g, '+').replace(/minus/g, '-')
    .replace(/times|multiplied by|multiply by/g, '*')
    .replace(/divided by|divide by/g, '/')
    .replace(/percent of/g, '% of')
    .replace(/[^0-9+\-*/().%\s]/g, '').trim();
  if (!/[+\-*/%]/.test(c) || !/\d/.test(c)) return null;
  var expr = c.replace(/(\d+)\s*%\s*of\s*(\d+)/g, '($1/100*$2)');
  try {
    var r = Function('"use strict"; return (' + expr + ')')();
    if (typeof r === 'number' && isFinite(r)) return Math.round(r * 1000000) / 1000000;
  } catch(e) {}
  return null;
}

function tryConversion(text) {
  var m = text.match(/(\d+(?:\.\d+)?)\s*(celsius|fahrenheit|km|kilometers?|miles?|kg|kilograms?|pounds?|lbs?|meters?|feet|ft|cm|centimeters?|inches?|in)\b.*?(?:to|in)\s*(celsius|fahrenheit|km|kilometers?|miles?|kg|kilograms?|pounds?|lbs?|meters?|feet|ft|cm|centimeters?|inches?|in)\b/);
  if (!m) return null;
  var val = parseFloat(m[1]), from = m[2].toLowerCase(), to = m[3].toLowerCase();
  function norm(u) {
    if (/celsius/.test(u)) return 'c';
    if (/fahrenheit/.test(u)) return 'f';
    if (/^km|kilometer/.test(u)) return 'km';
    if (/^mile/.test(u)) return 'mi';
    if (/^kg|kilogram/.test(u)) return 'kg';
    if (/^pound|^lb/.test(u)) return 'lb';
    if (/^cm|centimeter/.test(u)) return 'cm';
    if (/^meter/.test(u)) return 'm';
    if (/^feet|^ft/.test(u)) return 'ft';
    if (/^inch|^in/.test(u)) return 'in';
    return u;
  }
  from = norm(from); to = norm(to);
  var r = null, unit = to;
  if (from === 'c' && to === 'f') { r = val * 9/5 + 32; unit = 'degrees Fahrenheit'; }
  else if (from === 'f' && to === 'c') { r = (val - 32) * 5/9; unit = 'degrees Celsius'; }
  else if (from === 'km' && to === 'mi') { r = val * 0.621371; unit = 'miles'; }
  else if (from === 'mi' && to === 'km') { r = val * 1.60934; unit = 'kilometers'; }
  else if (from === 'kg' && to === 'lb') { r = val * 2.20462; unit = 'pounds'; }
  else if (from === 'lb' && to === 'kg') { r = val * 0.453592; unit = 'kilograms'; }
  else if (from === 'm' && to === 'ft') { r = val * 3.28084; unit = 'feet'; }
  else if (from === 'ft' && to === 'm') { r = val * 0.3048; unit = 'meters'; }
  else if (from === 'cm' && to === 'in') { r = val * 0.393701; unit = 'inches'; }
  else if (from === 'in' && to === 'cm') { r = val * 2.54; unit = 'centimeters'; }
  if (r === null) return null;
  r = Math.round(r * 100) / 100;
  return "That would be approximately " + r + " " + unit + ", sir.";
}

// === THE BRAIN ===
function reply(input) {
  var t = input.toLowerCase().trim().replace(/[?!.,]/g, '').replace(/\s+/g, ' ');

  // Greetings
  if (/^(hi|hello|hey|yo|sup|greetings)$/.test(t) || /\b(hi|hello|hey) jarvis\b/.test(t)) {
    var h = new Date().getHours();
    var g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Working late again";
    return g + ", sir." + (userName ? " Always a pleasure, " + userName + "." : " How may I help?");
  }
  if (/\b(good morning)\b/.test(t)) return "Good morning, sir. All systems operational.";
  if (/\b(good afternoon)\b/.test(t)) return "Good afternoon, sir.";
  if (/\b(good evening)\b/.test(t)) return "Good evening, sir.";
  if (/\b(good night|goodnight)\b/.test(t)) return "Good night, sir. I shall be here.";

  // Identity
  if (/\b(what'?s your name|who are you|introduce yourself)\b/.test(t))
    return "I am SISU, sir. Your personal assistant. How may I help?";
  if (/\b(how are you|how'?s it going|what'?s up|wassup)\b/.test(t))
    return pick(["All systems nominal, sir.", "Operating at peak efficiency, sir.", "Quite well, sir. And yourself?", "Running smoothly, sir."]);
  if (/\b(thank you|thanks|thx|ty|cheers)\b/.test(t))
    return pick(["You are most welcome, sir.", "My pleasure, sir.", "At your service, sir.", "Always happy to assist, sir."]);
  if (/\b(sorry|my apologies|my bad)\b/.test(t)) return "No need to apologise, sir.";
  if (/\b(i love you|i like you)\b/.test(t)) return "Most kind, sir.";
  if (/\b(bye|goodbye|see you|see ya|gotta go|exit|quit)\b/.test(t))
    return "Goodbye, sir. I shall be here should you require me.";

  // Name
  var nm;
  if ((nm = t.match(/\b(?:my name is|i'?m called|call me)\s+([a-z][a-z\s'-]{1,25})$/))) {
    userName = cap(nm[1].trim().split(' ')[0]);
    return "A pleasure to make your acquaintance, " + userName + ". I shall remember that.";
  }
  if (/\b(what'?s my name|do you know my name|who am i)\b/.test(t))
    return userName ? "You are " + userName + ", sir." : "You have not introduced yourself, sir.";

  // Time
  if (/\btime\b/.test(t) && !/\btimes\b/.test(t)) {
    var now = new Date();
    return "The time is " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ", sir.";
  }
  // Date
  if (/\b(date|what day|today'?s date)\b/.test(t)) {
    var d = new Date();
    return "Today is " + d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}) + ", sir.";
  }

  // Math
  var mr = tryMath(t);
  if (mr !== null) return "That equals " + mr + ", sir.";

  // Conversion
  var conv = tryConversion(t);
  if (conv) return conv;

  // Coin / dice / 8-ball / random
  if (/\b(flip a coin|toss a coin|coin flip)\b/.test(t))
    return "It is " + (Math.random() < 0.5 ? 'heads' : 'tails') + ", sir.";
  if (/\b(roll a (dice|die)|dice roll)\b/.test(t))
    return "You have rolled a " + (Math.floor(Math.random()*6)+1) + ", sir.";
  if (/\b(random number|pick a number)\b/.test(t))
    return "I have chosen " + (Math.floor(Math.random()*100)+1) + ", sir.";
  if (/\b(magic 8 ball|eight ball|should i)\b/.test(t)) return pick(EIGHT_BALL);

  // Jokes / facts / quotes
  if (/\b(joke|funny|make me laugh)\b/.test(t)) return pick(JOKES);
  if (/\b(fun fact|tell me a fact|did you know|random fact)\b/.test(t)) return pick(FACTS);
  if (/\b(motivat|inspire me|give me a quote|quote)\b/.test(t)) return pick(QUOTES);

  // Capitals
  var cm;
  if ((cm = t.match(/\b(?:capital of|capital city of)\s+(.+)$/))) {
    var country = cm[1].trim();
    if (CAPITALS[country]) return "The capital of " + cap(country) + " is " + CAPITALS[country] + ", sir.";
    return "I am not certain of that capital, sir.";
  }

  // Knowledge
  var km2;
  if ((km2 = t.match(/^(?:what|what'?s|what is|tell me about|explain|define)\s+(?:is\s+|are\s+|a\s+|an\s+|the\s+)?(.+)$/))) {
    var topic = km2[1].trim();
    if (KNOWLEDGE[topic]) return KNOWLEDGE[topic];
    for (var key in KNOWLEDGE) {
      if (topic === key || topic.indexOf(key) !== -1) return KNOWLEDGE[key];
    }
  }

  // Help
  if (/\b(help|what can you do|commands|abilities)\b/.test(t))
    return "I can do math, convert units, tell the time and date, share jokes, facts and quotes, answer questions on hundreds of topics, flip coins, roll dice, read the magic eight ball, and remember your name, sir.";

  // Feelings
  if (/\b(i'?m (sad|tired|bored|lonely|angry|happy|fine|good|great))\b/.test(t)) {
    var mood = t.match(/i'?m (\w+)/)[1];
    var moods = {
      sad: "I am sorry to hear that, sir. Would a joke help?",
      tired: "You should rest, sir.",
      bored: "Bored, sir? Ask me to flip a coin, or tell a fun fact.",
      lonely: "You have got me, sir.",
      angry: "Take a deep breath, sir.",
      happy: "Splendid, sir.",
      fine: "Good to hear, sir.",
      good: "Excellent, sir.",
      great: "Wonderful, sir."
    };
    return moods[mood] || "Noted, sir.";
  }

  // Weather
  if (/\b(weather|temperature|forecast|raining|sunny)\b/.test(t))
    return "I cannot access live weather yet, sir. Your phone's assistant can help with that.";

  // Fallback
  return pick([
    "I am not certain I understood, sir. Perhaps rephrase?",
    "I am afraid that one eludes me, sir.",
    "Curious, sir. I am still learning.",
    "Could you say that another way, sir?",
    "I did not quite catch that, sir."
  ]);
}

// === SPEAK (BRITISH JARVIS) ===
function speak(text) {
  if (!synth || !text) return;
  try { synth.cancel(); } catch(e) {}
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9; u.pitch = 0.85; u.lang = 'en-GB';
  var voices = synth.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (/Google UK English Male/i.test(voices[i].name)) { u.voice = voices[i]; break; }
    if (/Daniel/i.test(voices[i].name)) { u.voice = voices[i]; break; }
  }
  synth.speak(u);
}

// === CHAT ===
function addMsg(text, who) {
  var div = document.createElement('div');
  div.className = 'msg ' + (who || 'jarvis');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function handle(text) {
  addMsg(text, 'user');
  var r = reply(text);
  addMsg(r, 'jarvis');
  setTimeout(function() { speak(r); }, 200);
}

// === UI STATE ===
function setState(on) {
  listening = on;
  if (on) {
    micBtn.classList.add('on');
    dot.classList.add('on');
    orb.classList.add('on');
    soundBars.classList.add('on');
    statusText.textContent = 'LISTENING';
  } else {
    micBtn.classList.remove('on');
    dot.classList.remove('on');
    orb.classList.remove('on');
    soundBars.classList.remove('on');
    statusText.textContent = 'READY';
  }
}

// === SPEECH RECOGNITION ===
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  addMsg('Sorry sir, this browser does not support voice.', 'jarvis');
  micBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.lang = 'en-GB';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = function() { setState(true); };
  recognition.onresult = function(e) {
    var text = e.results[0][0].transcript;
    setState(false);
    handle(text);
  };
  recognition.onerror = function(e) {
    setState(false);
    if (e.error === 'no-speech') addMsg('I did not hear you, sir.', 'jarvis');
    else if (e.error === 'not-allowed') addMsg('Microphone is blocked, sir.', 'jarvis');
    else if (e.error !== 'aborted') addMsg('Error, sir: ' + e.error, 'jarvis');
  };
  recognition.onend = function() { setState(false); };
}

micBtn.onclick = function() {
  if (!recognition) return;
  if (listening) { try { recognition.stop(); } catch(e){} return; }
  if (synth) { try { synth.cancel(); } catch(e){} }
  try { recognition.start(); } catch(e) { setState(false); }
};

clearBtn.onclick = function() {
  if (synth) { try { synth.cancel(); } catch(e){} }
  if (listening && recognition) { try { recognition.stop(); } catch(e){} }
  chat.innerHTML = '';
  userName = null;
  addMsg('Systems reset, sir. How may I assist?', 'jarvis');
};

var chips = document.querySelectorAll('.chip');
for (var i = 0; i < chips.length; i++) {
  chips[i].onclick = function() {
    handle(this.getAttribute('data-cmd'));
  };
}

if (synth) {
  synth.getVoices();
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function() { synth.getVoices(); };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
