<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<title>SISU</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; font-family: 'Courier New', monospace; color: #fff; position: relative; }

  .matrix-bg { position: fixed; inset: 0; z-index: 0; background: #000; overflow: hidden; }
  .matrix-bg::before {
    content: '01001010 01000001 01010010 01010110 01001001 01010011 00100000 01010011 01011001 01010011 01010100 01000101 01001101 00100000 01001111 01001110 01001100 01001001 01001110 01000101 00100000 01010011 01001001 01010011 01010101 00100000 01000001 01001001';
    position: absolute; top: -50%; left: 0; right: 0; font-size: 11px; line-height: 1.6; color: #00ff41; opacity: 0.12; word-spacing: 4px; animation: matrix-fall 25s linear infinite; text-align: justify; white-space: pre-wrap; padding: 0 8px;
  }
  @keyframes matrix-fall { from { transform: translateY(-20%); } to { transform: translateY(50%); } }

  .scanlines { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px); }
  .scanline-move { position: fixed; left: 0; right: 0; z-index: 1; pointer-events: none; background: linear-gradient(180deg, transparent 0%, rgba(0,255,65,0.07) 50%, transparent 100%); height: 100px; animation: scan-move 6s linear infinite; }
  @keyframes scan-move { from { transform: translateY(-100px); } to { transform: translateY(100vh); } }

  .wrap { position: relative; z-index: 2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .box { width: 100%; max-width: 440px; max-height: 96vh; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; box-shadow: 0 0 40px rgba(0,255,65,0.1), inset 0 0 60px rgba(0,255,65,0.02); padding: 14px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .box::before, .box::after { content: ''; position: absolute; width: 22px; height: 22px; border: 1px solid #00ff41; pointer-events: none; }
  .box::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .box::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

  .term-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #222; font-size: 0.65rem; color: #666; letter-spacing: 1px; }
  .term-dots { display: flex; gap: 6px; }
  .term-dots span { width: 10px; height: 10px; border-radius: 50%; }
  .term-dots span:nth-child(1) { background: #ff5f56; }
  .term-dots span:nth-child(2) { background: #ffbd2e; }
  .term-dots span:nth-child(3) { background: #27c93f; }
  .term-title { color: #888; font-weight: bold; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 2px; }
  .title-wrap { display: flex; flex-direction: column; gap: 3px; }
  .title { font-size: 1.5rem; font-weight: bold; letter-spacing: 5px; color: #fff; text-shadow: 0 0 8px #00ff41; font-family: 'Courier New', monospace; }
  .title::before { content: '> '; color: #00ff41; }
  .title::after { content: '_'; color: #00ff41; animation: blink 1s step-end infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .subtitle { font-size: 0.55rem; letter-spacing: 3px; color: #00ff41; text-transform: uppercase; }
  .subtitle::before { content: '// '; color: #444; }

  .status { display: flex; align-items: center; gap: 6px; background: rgba(0,255,65,0.05); padding: 5px 10px; border: 1px solid #1a4a1a; font-size: 0.6rem; font-weight: bold; letter-spacing: 1.5px; color: #00ff41; font-family: 'Courier New', monospace; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #00ff41; box-shadow: 0 0 6px #00ff41; animation: blink-dot 1.5s ease-in-out infinite; }
  .dot.on { background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px #00ff41; animation: pulse-hacker 0.5s infinite alternate; }
  @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes pulse-hacker { from { opacity: 0.7; } to { opacity: 1; } }

  .orb-wrap { display: flex; justify-content: center; margin: 6px 0 10px; position: relative; height: 130px; }
  .orb { width: 120px; height: 120px; border-radius: 50%; position: relative; background: radial-gradient(circle at 50% 50%, #ffffff 0%, #ccffcc 5%, #00ff41 20%, #003300 60%, #000 100%); box-shadow: 0 0 25px #00ff41, 0 0 50px rgba(0,255,65,0.5), inset 0 0 30px #00ff41; display: flex; align-items: center; justify-content: center; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .orb.on { animation: fastpulse 0.6s ease-in-out infinite; }
  @keyframes fastpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  .ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; pointer-events: none; }
  .ring-1 { width: 140px; height: 140px; margin: -70px 0 0 -70px; border: 1px solid #00ff41; border-right-color: transparent; border-bottom-color: transparent; animation: spin 6s linear infinite; box-shadow: 0 0 10px rgba(0,255,65,0.4); }
  .ring-2 { width: 170px; height: 170px; margin: -85px 0 0 -85px; border: 1px dashed rgba(0,255,65,0.3); animation: spin 12s linear infinite reverse; }
  .ring-3 { width: 105px; height: 105px; margin: -52.5px 0 0 -52.5px; border: 1px solid #ccffcc; border-top-color: transparent; border-left-color: transparent; animation: spin 4s linear infinite reverse; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .orb-icon { width: 50px; height: 50px; z-index: 3; position: relative; }

  .hud { display: flex; justify-content: space-between; font-size: 0.5rem; letter-spacing: 1.5px; color: #00ff41; text-transform: uppercase; padding: 0 4px; margin-bottom: 8px; font-family: 'Courier New', monospace; }
  .hud-item { display: flex; align-items: center; gap: 4px; }
  .hud-bar { display: inline-block; width: 22px; height: 3px; background: rgba(0,255,65,0.15); overflow: hidden; position: relative; }
  .hud-bar::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; background: #00ff41; box-shadow: 0 0 6px #00ff41; animation: fill 4s ease-in-out infinite; }
  .hud-bar.b1::after { width: 60%; }
  .hud-bar.b2::after { width: 40%; animation-delay: 1s; }
  .hud-bar.b3::after { width: 80%; animation-delay: 2s; }
  @keyframes fill { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .chat { flex: 1; overflow-y: auto; padding: 8px 6px; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; min-height: 150px; max-height: 240px; background: #000; border: 1px solid #1a4a1a; font-family: 'Courier New', monospace; }
  .chat::-webkit-scrollbar { width: 3px; }
  .chat::-webkit-scrollbar-thumb { background: #1a4a1a; }
  .msg { padding: 7px 10px; font-size: 0.82rem; line-height: 1.5; max-width: 92%; word-wrap: break-word; animation: slide 0.3s ease; }
  @keyframes slide { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; color: #fff; background: rgba(255,255,255,0.05); border-left: 2px solid #fff; }
  .msg.user::before { content: '> '; color: #888; }
  .msg.jarvis { align-self: flex-start; color: #00ff41; background: rgba(0,255,65,0.04); border-left: 2px solid #00ff41; text-shadow: 0 0 4px rgba(0,255,65,0.4); }
  .msg.jarvis::before { content: '$ '; color: #00ff41; opacity: 0.6; }

  .input-area { display: flex; gap: 6px; margin-top: 8px; }
  .input-area input { flex: 1; background: #000; border: 1px solid #1a4a1a; color: #00ff41; padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 0.8rem; outline: none; }
  .input-area input:focus { border-color: #00ff41; }
  .input-area button { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 0 16px; font-family: 'Courier New', monospace; font-weight: bold; cursor: pointer; }
  .input-area button:active { background: rgba(0,255,65,0.15); }

  .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; }
  .quick-chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; background: #000; border: 1px solid #1a4a1a; color: #00ff41; padding: 5px 10px; font-size: 0.65rem; font-family: 'Courier New', monospace; white-space: nowrap; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  .chip:active { background: rgba(0,255,65,0.15); }

  .sound-bars { display: none; justify-content: center; align-items: flex-end; gap: 3px; height: 20px; padding: 4px 0; }
  .sound-bars.on { display: flex; }
  .sound-bars span { display: block; width: 3px; background: #00ff41; animation: wave 0.8s ease-in-out infinite; box-shadow: 0 0 6px #00ff41; }
  .sound-bars span:nth-child(1) { height: 30%; animation-delay: 0s; }
  .sound-bars span:nth-child(2) { height: 60%; animation-delay: 0.1s; }
  .sound-bars span:nth-child(3) { height: 90%; animation-delay: 0.2s; }
  .sound-bars span:nth-child(4) { height: 50%; animation-delay: 0.3s; }
  .sound-bars span:nth-child(5) { height: 80%; animation-delay: 0.4s; }
  .sound-bars span:nth-child(6) { height: 100%; animation-delay: 0.5s; }
  .sound-bars span:nth-child(7) { height: 70%; animation-delay: 0.6s; }
  .sound-bars span:nth-child(8) { height: 45%; animation-delay: 0.7s; }
  .sound-bars span:nth-child(9) { height: 55%; animation-delay: 0.8s; }
  @keyframes wave { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 8px; }
  .mic { width: 70px; height: 70px; border-radius: 50%; border: 1px solid #00ff41; background: #000; box-shadow: 0 0 15px rgba(0,255,65,0.4), inset 0 0 10px rgba(0,255,65,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .mic:active { transform: scale(0.9); }
  .mic.on { background: #001a00; box-shadow: 0 0 30px #00ff41, inset 0 0 15px #00ff41; animation: pulse-hacker 0.6s infinite alternate; }
  .mic svg { width: 32px; height: 32px; fill: #00ff41; }
  .mic.on svg { fill: #fff; }

  .clear { width: 48px; height: 48px; border-radius: 50%; border: 1px solid #333; background: #000; color: #00ff41; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
  .clear:active { background: rgba(0,255,65,0.15); }

  .hint { text-align: center; color: #333; font-size: 0.55rem; letter-spacing: 3px; margin-top: 8px; text-transform: uppercase; font-family: 'Courier New', monospace; }
</style>
</head>
<body>
<div class="matrix-bg"></div>
<div class="scanlines"></div>
<div class="scanline-move"></div>

<div class="wrap">
  <div class="box">

    <div class="term-bar">
      <div class="term-dots"><span></span><span></span><span></span></div>
      <div class="term-title">sisu@localhost: ~</div>
      <div>v3.0</div>
    </div>

    <div class="header">
      <div class="title-wrap">
        <div class="title">SISU</div>
        <div class="subtitle">ai terminal · online</div>
      </div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">READY</span>
      </div>
    </div>

    <div class="orb-wrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="orb" id="orb">
        <svg class="orb-icon" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="38" stroke="#00ff41" stroke-width="2" stroke-dasharray="6 10" opacity="0.8"/>
          <circle cx="50" cy="50" r="26" stroke="#ccffcc" stroke-width="2" stroke-dasharray="4 8"/>
          <circle cx="50" cy="50" r="14" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="6" fill="#ffffff"/>
          <circle cx="50" cy="50" r="3" fill="#00ff41"/>
        </svg>
      </div>
    </div>

    <div class="hud">
      <div class="hud-item">CPU <span class="hud-bar b1"></span></div>
      <div class="hud-item">NET <span class="hud-bar b2"></span></div>
      <div class="hud-item">PWR <span class="hud-bar b3"></span></div>
      <div class="hud-item">v3.0</div>
    </div>

    <div class="chat" id="chat">
      <div class="msg jarvis">Good evening, sir. SISU v3.0 online. How may I assist?</div>
    </div>

    <!-- KEYBOARD INPUT -->
    <div class="input-area">
      <input type="text" id="textInput" placeholder="type a command, sir...">
      <button id="sendBtn">SEND</button>
    </div>

    <div class="quick-chips">
      <div class="chip" data-cmd="what time is it">time</div>
      <div class="chip" data-cmd="tell me a joke">joke</div>
      <div class="chip" data-cmd="flip a coin">coin</div>
      <div class="chip" data-cmd="roll a dice">dice</div>
      <div class="chip" data-cmd="tell me a fun fact">fact</div>
    </div>

    <div class="sound-bars" id="soundBars">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="controls">
      <button class="mic" id="micBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 15.5c-1.66 0-3-1.34-3-3v-6c0-1.66 1.34-3 3-3s3 1.34 3 3v6c0 1.66-1.34 3-3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V22h2v-2.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <button class="clear" id="clearBtn">↺</button>
    </div>

    <div class="hint">tap mic · speak · type</div>
  </div>
</div>

<script>
var chat = document.getElementById('chat');
var micBtn = document.getElementById('micBtn');
var clearBtn = document.getElementById('clearBtn');
var dot = document.getElementById('dot');
var statusText = document.getElementById('statusText');
var orb = document.getElementById('orb');
var soundBars = document.getElementById('soundBars');
var textInput = document.getElementById('textInput');
var sendBtn = document.getElementById('sendBtn');

var listening = false;
var recognition = null;
var synth = window.speechSynthesis;
var userName = null;

// === AI BRAIN (GROQ) ===
// Paste your Groq API key below!
var API_KEY = "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"; 

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// Quick offline answers
function tryMath(text) {
  var c = text.replace(/what(?:'s| is)?/g, '').replace(/calculate|compute|solve|equals?|how much is/g, '').replace(/plus/g, '+').replace(/minus/g, '-').replace(/times|multiplied by|multiply by/g, '*').replace(/divided by|divide by/g, '/').replace(/[^0-9+\-*/().\s]/g, '').trim();
  if (!/[+\-*/]/.test(c) || !/\d/.test(c)) return null;
  try { var r = Function('"use strict"; return (' + c + ')')(); if (typeof r === 'number' && isFinite(r)) return Math.round(r * 1000000) / 1000000; } catch(e) {}
  return null;
}

function addMsg(text, who) {
  var div = document.createElement('div');
  div.className = 'msg ' + (who || 'jarvis');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!synth || !text) return;
  try { synth.cancel(); } catch(e) {}
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9; u.pitch = 0.85; u.lang = 'en-GB';
  var voices = synth.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (/Google UK English Male/i.test(voices[i].name)) { u.voice = voices[i]; break; }
    if (/Daniel/i.test(voices[i].name)) { u.voice = voices[i]; break; }
  }
  synth.speak(u);
}

// === REAL AI CALL ===
async function getSmartAnswer(userText) {
  if (!API_KEY || API_KEY.includes("YOUR_SECRET")) {
    addMsg("I need an API key to think, sir. Check the code!", 'jarvis');
    speak("I need an A P I key to think, sir.");
    return;
  }

  try {
    var response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "llama3-8b-8192",
        messages: [
          { role: "system", content: "You are SISU, a helpful, intelligent AI voice assistant. You call the user 'sir' and speak with a polite British butler tone. Keep your answers concise and conversational (under 3 sentences)." },
          { role: "user", content: userText }
        ]
      })
    });

    var data = await response.json();
    
    if (data.choices && data.choices.length > 0) {
      var aiReply = data.choices[0].message.content;
      
      // Remove the "Let me think..." message
      if (chat.lastChild && chat.lastChild.textContent.includes("Let me think")) {
        chat.removeChild(chat.lastChild);
      }
      
      addMsg(aiReply, 'jarvis');
      speak(aiReply);
    } else {
      addMsg("My mainframe connection failed, sir.", 'jarvis');
    }
  } catch (error) {
    addMsg("Network error, sir. I cannot reach the mainframe.", 'jarvis');
    speak("Network error, sir.");
  }
}

// === ROUTER (Offline first, then AI) ===
function handle(text) {
  addMsg(text, 'user');
  var t = text.toLowerCase().trim().replace(/[?!.,]/g, '').replace(/\s+/g, ' ');
  var r = "";

  // 1. Check offline commands first (instant)
  if (/^(hi|hello|hey|yo|sup|greetings)$/.test(t)) {
    var h = new Date().getHours();
    var g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    r = g + ", sir. How may I help?";
  } else if (/\b(what'?s your name|who are you)\b/.test(t)) {
    r = "I am SISU, sir. Your personal assistant.";
  } else if (/\btime\b/.test(t) && !/\btimes\b/.test(t)) {
    r = "The time is " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ", sir.";
  } else if (/\b(date|what day|today'?s date)\b/.test(t)) {
    r = "Today is " + new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'}) + ", sir.";
  } else if (/\b(flip a coin|toss a coin)\b/.test(t)) {
    r = "It is " + (Math.random() < 0.5 ? 'heads' : 'tails') + ", sir.";
  } else if (/\b(roll a (dice|die))\b/.test(t)) {
    r = "You have rolled a " + (Math.floor(Math.random()*6)+1) + ", sir.";
  } else if (/\b(joke|funny|laugh)\b/.test(t)) {
    r = pick([
      "Why did the developer go broke, sir? He used up all his cache.",
      "Why do programmers prefer dark mode, sir? Because light attracts bugs.",
      "What is a computer's favourite snack, sir? Microchips.",
      "Why did the smartphone need glasses, sir? It lost all its contacts."
    ]);
  } else if (/\b(fact|fun fact|did you know)\b/.test(t)) {
    r = pick([
      "Honey never spoils, sir. Three thousand year old honey was found in Egyptian tombs.",
      "Octopuses have three hearts and blue blood, sir.",
      "A day on Venus is longer than its year, sir.",
      "Bananas are berries, sir, but strawberries are not.",
      "Sharks existed before trees did, sir.",
      "Your brain uses about twenty percent of your body's total energy, sir."
    ]);
  } else if (/\b(thank you|thanks|thx|cheers)\b/.test(t)) {
    r = "You are most welcome, sir.";
  } else if (/\b(bye|goodbye|see you)\b/.test(t)) {
    r = "Goodbye, sir. I shall be here.";
  } else {
    // Math check
    var mr = tryMath(t);
    if (mr !== null) r = "That equals " + mr + ", sir.";
  }

  // 2. If offline command found, say it.
  if (r !== "") {
    addMsg(r, 'jarvis');
    speak(r);
  } else {
    // 3. If NO offline command, ask the real AI!
    addMsg("Let me think about that, sir...", 'jarvis');
    getSmartAnswer(text);
  }
}

// === LISTENING & UI ===
function setState(on) {
  listening = on;
  if (on) {
    micBtn.classList.add('on');
    dot.classList.add('on');
    orb.classList.add('on');
    soundBars.classList.add('on');
    statusText.textContent = 'LISTENING';
  } else {
    micBtn.classList.remove('on');
    dot.classList.remove('on');
    orb.classList.remove('on');
    soundBars.classList.remove('on');
    statusText.textContent = 'READY';
  }
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  addMsg('Sorry sir, this browser does not support voice.', 'jarvis');
  micBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.lang = 'en-GB';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = function() { setState(true); };
  recognition.onresult = function(e) {
    var text = e.results[0][0].transcript;
    setState(false);
    handle(text);
  };
  recognition.onerror = function(e) {
    setState(false);
    if (e.error === 'no-speech') addMsg('I did not hear you, sir.', 'jarvis');
    else if (e.error === 'not-allowed') addMsg('Microphone is blocked, sir.', 'jarvis');
    else if (e.error !== 'aborted') addMsg('Error, sir: ' + e.error, 'jarvis');
  };
  recognition.onend = function() { setState(false); };
}

function startListening() {
  if (!recognition) return;
  if (listening) { try { recognition.stop(); } catch(e){} return; }
  if (synth) { try { synth.cancel(); } catch(e){} }
  try { recognition.start(); } catch(e) { setState(false); }
}

// === MIC BUTTON ===
micBtn.onclick = function() {
  startListening();
};

// === KEYBOARD INPUT ===
function sendText() {
  var val = textInput.value.trim();
  if (!val) return;
  textInput.value = '';
  handle(val); // Send to brain
}

sendBtn.onclick = sendText;

textInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    sendText();
    textInput.blur(); // Hides keyboard
  }
});

clearBtn.onclick = function() {
  if (synth) { try { synth.cancel(); } catch(e){} }
  if (listening && recognition) { try { recognition.stop(); } catch(e){} }
  chat.innerHTML = '';
  userName = null;
  addMsg('Systems reset, sir. How may I assist?', 'jarvis');
};

var chips = document.querySelectorAll('.chip');
for (var i = 0; i < chips.length; i++) {
  chips[i].onclick = function() {
    handle(this.getAttribute('data-cmd'));
  };
}

if (synth) {
  synth.getVoices();
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function() { synth.getVoices(); };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
